<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>双节遇良辰 · 茅台叙团圆</title>
<meta name="description" content="茅台中秋主题活动邀请函登记页" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23b50812'/%3E%3Cpath d='M14 37c11-15 25-15 36 0' fill='none' stroke='%23f7d7a2' stroke-width='4'/%3E%3Ccircle cx='32' cy='28' r='7' fill='%23f7d7a2'/%3E%3C/svg%3E" />
<style>
:root{--red:#9d0812;--deep:#57040a;--gold:#e9bd7b;--cream:#fff8ef;--ink:#3a1110}
*{box-sizing:border-box}
body{margin:0;background:var(--deep);color:var(--cream);font-family:"Noto Serif SC","Songti SC",serif;min-height:100vh}
.hero{width:100%;margin:0;background:#a10910}
.hero-image{display:block;width:100%;height:auto}
.content{max-width:1200px;margin:0 auto;padding:32px 20px 64px}
.card{background:linear-gradient(145deg,#fffaf2,#f5e4ca);color:var(--ink);border:1px solid rgba(233,189,123,.75);box-shadow:0 18px 50px rgba(0,0,0,.28);border-radius:4px;padding:clamp(24px,4vw,48px);display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:44px}
.intro{border-right:1px solid #dfc7a7;padding-right:36px}
.seal{width:44px;height:44px;border:1px solid var(--red);border-radius:50%;display:grid;place-items:center;color:var(--red);font-size:20px;margin-bottom:18px}
.intro h2{font-size:clamp(25px,3vw,38px);margin:0 0 14px;color:var(--red)}
.intro p{font-size:16px;line-height:1.9;margin:0 0 24px}
.details{display:grid;gap:12px;font-size:15px}
.detail{display:flex;gap:14px;line-height:1.7}
.label{color:#9c6f42;flex:0 0 70px}
.detail span:last-child{min-width:0;overflow-wrap:anywhere}
.form h3{margin:0 0 8px;font-size:26px;color:var(--red)}
.form .hint{font-size:14px;color:#806657;margin:0 0 22px}
form{display:grid;gap:16px}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
label{font-size:14px;color:#6d4436;display:grid;gap:7px}
.intro,.form,.row,label,input,select{min-width:0}
input,select{width:100%;min-height:48px;border:1px solid #d8b991;border-radius:2px;padding:13px 14px;background:#fffdf9;color:var(--ink);font-family:inherit;font-size:16px;line-height:1.5;outline:none}
input:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(157,8,18,.1)}
.check{display:flex;align-items:flex-start;gap:9px;font-size:14px;color:#806657;line-height:1.5}
.check input{flex:0 0 18px;width:18px;min-height:18px;margin-top:2px;accent-color:var(--red)}
button{border:0;background:var(--red);color:#fff8ef;padding:15px 20px;border-radius:2px;font-family:inherit;font-weight:600;font-size:16px;min-height:50px;letter-spacing:.12em;cursor:pointer;transition:background .2s}
button:hover{background:#78050d}
button:focus-visible{outline:3px solid #9c6f42;outline-offset:3px}
.success{display:none;padding:24px;border:1px solid #d4a76e;background:#fff6e5;color:var(--red);font-size:17px;line-height:1.7}
.success.show{display:block}
.footer{text-align:center;color:#e3bb85;font-size:13px;padding:0 20px 30px;letter-spacing:.08em}
@media(max-width:1000px){.card{grid-template-columns:1fr;gap:28px}.intro{border-right:0;border-bottom:1px solid #dfc7a7;padding:0 0 24px}}
@media(max-width:600px){.content{padding:20px 14px 36px}.card{padding:24px 20px}.row{grid-template-columns:1fr}.detail{gap:10px}.form h3{font-size:25px}}
.honeypot{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}#formMessage{margin:0;color:var(--red);font-size:14px;line-height:1.6}#formMessage:empty{display:none}button:disabled{opacity:.6;cursor:wait}.footer a{color:inherit;margin-left:16px;text-underline-offset:4px}</style>
</head>
<body>
<header class="hero"><img class="hero-image" src="moutai-hero.jpg" width="1654" height="709" alt="贵州茅台：双节遇良辰，茅台叙团圆。月圆迎盛世，佳酿贺家国。" fetchpriority="high" /></header>
<main class="content"><section class="card"><div class="intro"><div class="seal">酿</div><h2>诚邀莅临</h2><p>一轮明月，映照团圆心意；一杯茅台，共叙美好时光。诚邀您出席本次中秋主题活动，与我们共品佳酿，共赏团圆。</p><div class="details"><div class="detail"><span class="label">活动时间</span><span>以正式邀请函为准</span></div><div class="detail"><span class="label">活动地点</span><span>以正式邀请函为准</span></div><div class="detail"><span class="label">着装建议</span><span>商务正装 / 中国风雅致着装</span></div></div></div><div class="form"><h3>登记邀请信息</h3><p class="hint">请填写以下信息，我们将为您预留席位。</p><form id="inviteForm" data-api-base="https://moutai-reunion-invitation.mcelligottsantini38.chatgpt.site"><div class="row"><label>姓名<input name="name" required maxlength="60" autocomplete="name" placeholder="请输入您的姓名" /></label><label>手机号码<input name="phone" maxlength="11" autocomplete="tel" inputmode="numeric" type="tel" required pattern="1[0-9]{10}" placeholder="请输入11位手机号" /></label></div><div class="row"><label>公司 / 单位<input name="company" maxlength="150" autocomplete="organization" placeholder="请输入公司或单位名称" /></label><label>出席人数<select name="guests"><option value="1">1位</option><option value="2">2位</option><option value="3">3位</option><option value="4">4位及以上</option></select></label></div><label>备注<input name="note" maxlength="500" placeholder="如有饮食或出行需求，请在此备注" /></label><label class="check"><input type="checkbox" name="consent" required /> <span>我同意主办方使用以上信息进行活动席位确认与行前通知。</span></label><label class="honeypot" aria-hidden="true">请留空<input name="website" tabindex="-1" autocomplete="off" /></label><p id="formMessage" role="alert"></p><button type="submit">提交登记</button></form><div class="success" id="success" role="status" tabindex="-1">登记信息已提交。<br/>信息已保存，感谢您的回复。席位安排以主办方后续通知为准。</div></div></section></main><div class="footer">贵州茅台 · 以酒会友 · 共叙团圆<a href="https://moutai-reunion-invitation.mcelligottsantini38.chatgpt.site/admin">主办方入口</a></div>
<script src="app.js" defer></script>
</body></html>
